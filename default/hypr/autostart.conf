# Kusogarch - Default Autostart (Immutable)

exec-once = hypridle
exec-once = mako
exec-once = waybar
# Wallpaper (hyprpaper on bare metal, swaybg fallback in VMs where EGL is unavailable)
exec-once = bash -c 'if systemd-detect-virt -q 2>/dev/null; then WP=$(sed -n "s/^preload = //p" ~/.config/hypr/hyprpaper.conf | head -1); [ -f "$WP" ] && swaybg -i "$WP" -m fill || swaybg -c "#1e1e2e"; else hyprpaper; fi'
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = kusogarch-first-run

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# GNOME Keyring
exec-once = gnome-keyring-daemon --start --components=secrets

# Ensure systemd knows our env vars (fixes slow app launch)
exec-once = systemctl --user import-environment
exec-once = dbus-update-activation-environment --systemd --all
