# Kusogarch - Default Autostart (Immutable)

exec-once = hypridle
exec-once = mako
exec-once = waybar
# Background: use theme wallpaper if it exists, otherwise solid color
exec-once = bash -c 'if [ -f ~/.config/kusogarch/current/theme/wallpaper.jpg ]; then swaybg -i ~/.config/kusogarch/current/theme/wallpaper.jpg -m fill; elif [ -f ~/.config/kusogarch/current/theme/wallpaper.png ]; then swaybg -i ~/.config/kusogarch/current/theme/wallpaper.png -m fill; else swaybg -c "#1e1e2e"; fi'
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = kusogarch-first-run

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# GNOME Keyring
exec-once = gnome-keyring-daemon --start --components=secrets

# Ensure systemd knows our env vars (fixes slow app launch)
exec-once = systemctl --user import-environment
exec-once = dbus-update-activation-environment --systemd --all
