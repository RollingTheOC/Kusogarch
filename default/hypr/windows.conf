# Kusogarch - Default Window Rules (Immutable)

# Suppress maximize events globally
windowrule = suppress_event maximize, match:class .*

# Default opacity for all windows (apps can opt out via tag)
windowrule = tag +default-opacity, match:class .*
windowrule = opacity 0.97 0.9, match:tag default-opacity

# Floating windows: dialogs, file pickers, system utils
windowrule = tag +floating-window, match:class (gnome-calculator|pavucontrol|nm-connection-editor|blueman-manager|gnome-disks|system-config-printer)
windowrule = tag +floating-window, match:title ^(Open|Open File|Save|Save As|Choose|Select|Confirm|Properties)$
windowrule = float 1, match:tag floating-window
windowrule = center 1, match:tag floating-window
windowrule = size 800 550, match:tag floating-window

# Picture-in-Picture
windowrule = float 1, match:title ^(Picture-in-Picture)$
windowrule = pin 1, match:title ^(Picture-in-Picture)$
windowrule = border_size 0, match:title ^(Picture-in-Picture)$

# Kusogarch menu windows
windowrule = float 1, match:class ^(kusogarch-menu)$
windowrule = size 700 500, match:class ^(kusogarch-menu)$
windowrule = center 1, match:class ^(kusogarch-menu)$

# Floating kitty
windowrule = float 1, match:class ^(kitty-float)$
windowrule = size 800 500, match:class ^(kitty-float)$
windowrule = center 1, match:class ^(kitty-float)$

# Web apps (chromium --app mode) — no border, full opacity
windowrule = tag -default-opacity, match:class ^(webapp-)
windowrule = border_size 0, match:class ^(webapp-)

# Steam
windowrule = tag -default-opacity, match:class ^(steam)$
windowrule = float 1, match:class ^(steam)$, match:title ^(Friends List)$

# Layer rules
layerrule = blur 1, match:namespace waybar
layerrule = ignore_alpha 0.0, match:namespace waybar
layerrule = blur 1, match:namespace notifications
layerrule = ignore_alpha 0.0, match:namespace notifications
