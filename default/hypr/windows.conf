# Kusogarch - Default Window Rules (Immutable)

windowrule = float, class:^(gnome-calculator)$
windowrule = float, class:^(pavucontrol)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = float, title:^(Open File)$
windowrule = float, title:^(Save As)$

# Kusogarch menu windows
windowrule = float, class:^(kusogarch-menu)$
windowrule = size 700 500, class:^(kusogarch-menu)$
windowrule = center, class:^(kusogarch-menu)$

# Floating kitty
windowrule = float, class:^(kitty-float)$
windowrule = size 800 500, class:^(kitty-float)$
windowrule = center, class:^(kitty-float)$
