# Kusogarch - Window & Workspace Management (Immutable)

# Close window
bindd = SUPER, W, Close Window, killactive
bindd = CTRL ALT, Delete, Close All Windows, exec, hyprctl dispatch closewindow address:*

# Window focus (arrow keys)
bindd = SUPER, Left, Focus Left, movefocus, l
bindd = SUPER, Right, Focus Right, movefocus, r
bindd = SUPER, Up, Focus Up, movefocus, u
bindd = SUPER, Down, Focus Down, movefocus, d

# Window focus (vim keys)
bindd = SUPER, H, Focus Left, movefocus, l
bindd = SUPER, L, Focus Right, movefocus, r

# Swap windows
bindd = SUPER SHIFT, Left, Swap Left, swapwindow, l
bindd = SUPER SHIFT, Right, Swap Right, swapwindow, r
bindd = SUPER SHIFT, Up, Swap Up, swapwindow, u
bindd = SUPER SHIFT, Down, Swap Down, swapwindow, d

# Split direction toggle
bindd = SUPER, J, Toggle Split, togglesplit

# Pseudo tile
bindd = SUPER, P, Pseudo Tile, pseudo

# Fullscreen
bindd = SUPER, F, Fullscreen, fullscreen, 0
bindd = SUPER CTRL, F, Tiled Fullscreen, fullscreenstate, 0 2
bindd = SUPER ALT, F, Full Width, fullscreen, 1

# Float toggle
bindd = SUPER, T, Toggle Float, togglefloating

# Pop out (float + pin)
bindd = SUPER, O, Pop Out Window, exec, hyprctl dispatch togglefloating && hyprctl dispatch pin

# Resize with Super +/-
bindde = SUPER, minus, Shrink Window, resizeactive, -40 -40
bindde = SUPER, equal, Grow Window, resizeactive, 40 40

# Resize with Super+Ctrl+Arrow
bindde = SUPER CTRL, Left, Resize Left, resizeactive, -40 0
bindde = SUPER CTRL, Right, Resize Right, resizeactive, 40 0
bindde = SUPER CTRL, Up, Resize Up, resizeactive, 0 -40
bindde = SUPER CTRL, Down, Resize Down, resizeactive, 0 40

# Workspaces 1-10 (using keycodes for layout independence)
bindd = SUPER, code:10, Workspace 1, workspace, 1
bindd = SUPER, code:11, Workspace 2, workspace, 2
bindd = SUPER, code:12, Workspace 3, workspace, 3
bindd = SUPER, code:13, Workspace 4, workspace, 4
bindd = SUPER, code:14, Workspace 5, workspace, 5
bindd = SUPER, code:15, Workspace 6, workspace, 6
bindd = SUPER, code:16, Workspace 7, workspace, 7
bindd = SUPER, code:17, Workspace 8, workspace, 8
bindd = SUPER, code:18, Workspace 9, workspace, 9
bindd = SUPER, code:19, Workspace 10, workspace, 10

# Move window to workspace
bindd = SUPER SHIFT, code:10, Move to WS 1, movetoworkspace, 1
bindd = SUPER SHIFT, code:11, Move to WS 2, movetoworkspace, 2
bindd = SUPER SHIFT, code:12, Move to WS 3, movetoworkspace, 3
bindd = SUPER SHIFT, code:13, Move to WS 4, movetoworkspace, 4
bindd = SUPER SHIFT, code:14, Move to WS 5, movetoworkspace, 5
bindd = SUPER SHIFT, code:15, Move to WS 6, movetoworkspace, 6
bindd = SUPER SHIFT, code:16, Move to WS 7, movetoworkspace, 7
bindd = SUPER SHIFT, code:17, Move to WS 8, movetoworkspace, 8
bindd = SUPER SHIFT, code:18, Move to WS 9, movetoworkspace, 9
bindd = SUPER SHIFT, code:19, Move to WS 10, movetoworkspace, 10

# Move window silently (stay on current workspace)
bindd = SUPER SHIFT ALT, code:10, Send to WS 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT ALT, code:11, Send to WS 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT ALT, code:12, Send to WS 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT ALT, code:13, Send to WS 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT ALT, code:14, Send to WS 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT ALT, code:15, Send to WS 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT ALT, code:16, Send to WS 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT ALT, code:17, Send to WS 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT ALT, code:18, Send to WS 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT ALT, code:19, Send to WS 10, movetoworkspacesilent, 10

# Workspace navigation
bindd = SUPER, Tab, Next Workspace, workspace, e+1
bindd = SUPER SHIFT, Tab, Prev Workspace, workspace, e-1
bindd = SUPER CTRL, Tab, Last Workspace, workspace, previous

# Scratchpad
bindd = SUPER, S, Toggle Scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER ALT, S, Move to Scratchpad, movetoworkspace, special:scratchpad

# Window groups
bindd = SUPER, G, Toggle Group, togglegroup
bindd = SUPER ALT, G, Move Out of Group, moveoutofgroup
bindd = SUPER ALT, Tab, Next in Group, changegroupactive, f

# Mouse bindings
bindmd = SUPER, mouse:272, Move Window, movewindow
bindmd = SUPER, mouse:273, Resize Window, resizewindow
bindd = SUPER, mouse_up, Prev Workspace, workspace, e-1
bindd = SUPER, mouse_down, Next Workspace, workspace, e+1

# Alt+Tab window cycling
bindd = ALT, Tab, Cycle Windows, cyclenext
bindd = ALT SHIFT, Tab, Cycle Windows Back, cyclenext, prev
