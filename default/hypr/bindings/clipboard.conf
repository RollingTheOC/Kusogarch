# Kusogarch - Clipboard Keybindings

# Clipboard history (via cliphist + fzf in terminal)
bindd = SUPER CTRL, V, Clipboard History, exec, kitty --class kusogarch-menu -e bash -c 'cliphist list | fzf --layout=reverse --border=rounded --prompt="Clipboard > " | cliphist decode | wl-copy'

# Clear clipboard history
bindd = SUPER CTRL SHIFT, V, Clear Clipboard, exec, cliphist wipe
