# Kusogarch - Surface Touch & Pen Configuration
# Only deployed on Surface mode installs

input {
    touchdevice {
        enabled = true
    }
}

# Touch gestures for workspace navigation
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_create_new = true
}

# Bind touchscreen to built-in display
device {
    name = ipts-touchscreen
    output = eDP-1
}

device {
    name = ithc-touchscreen
    output = eDP-1
}

# Surface Pen
device {
    name = ipts-stylus
    output = eDP-1
}

device {
    name = ithc-stylus
    output = eDP-1
}
