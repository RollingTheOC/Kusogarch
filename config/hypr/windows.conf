# Kusogarch - Window Rules
# See: https://wiki.hyprland.org/Configuring/Window-Rules/

# Float certain windows
windowrulev2 = float, class:^(gnome-calculator)$
windowrulev2 = float, class:^(gnome-disks)$
windowrulev2 = float, class:^(system-config-printer)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(org.gnome.Nautilus)$, title:^(Properties)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save As)$
windowrulev2 = float, title:^(Confirm)$

# Pin picture-in-picture
windowrulev2 = pin, title:^(Picture-in-Picture)$

# File dialogs
windowrulev2 = float, title:^(Open)$
windowrulev2 = float, title:^(Choose)$
windowrulev2 = float, title:^(Select)$

# Size constraints for floating
windowrulev2 = size 800 500, class:^(gnome-calculator)$

# Layer rules
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, notifications
layerrule = ignorezero, notifications
