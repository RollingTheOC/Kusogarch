# Kusogarch - Window Rules
# See: https://wiki.hyprland.org/Configuring/Window-Rules/

# Float certain windows
windowrule = float, class:^(gnome-calculator)$
windowrule = float, class:^(gnome-disks)$
windowrule = float, class:^(system-config-printer)$
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(org.gnome.Nautilus)$, title:^(Properties)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = float, title:^(Open File)$
windowrule = float, title:^(Save As)$
windowrule = float, title:^(Confirm)$

# Pin picture-in-picture
windowrule = pin, title:^(Picture-in-Picture)$

# File dialogs
windowrule = float, title:^(Open)$
windowrule = float, title:^(Choose)$
windowrule = float, title:^(Select)$

# Size constraints for floating
windowrule = size 800 500, class:^(gnome-calculator)$

# Layer rules
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, notifications
layerrule = ignorezero, notifications
