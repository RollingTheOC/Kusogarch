# Kusogarch - Monitor Configuration
# See: https://wiki.hyprland.org/Configuring/Monitors/

# Auto-detect and use preferred resolution/refresh rate
monitor = , preferred, auto, 1

# For Surface devices with high-DPI displays, you may want:
# monitor = eDP-1, preferred, auto, 1.5
# Adjust the scale (last value) based on your display.

# For multi-monitor setups, configure each monitor:
# monitor = DP-1, 2560x1440@144, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1
