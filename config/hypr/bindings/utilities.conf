# Kusogarch - Utility Keybindings

# Screenshots
bindd = , Print, Screenshot (Edit), exec, kusogarch-cmd-screenshot
bindd = SHIFT, Print, Screenshot (Clipboard), exec, grim -g "$(slurp)" - | wl-copy
bindd = CTRL, Print, Screenshot (Full), exec, grim - | wl-copy

# Color picker
bindd = SUPER, Print, Color Picker, exec, kusogarch-cmd-colorpicker

# Lock screen
bindd = SUPER CTRL, L, Lock Screen, exec, kusogarch-cmd-lock

# Toggles
bindd = SUPER SHIFT, B, Toggle Waybar, exec, kusogarch-toggle-waybar
bindd = SUPER CTRL, N, Toggle Nightlight, exec, kusogarch-toggle-nightlight
bindd = SUPER CTRL, Space, Next Wallpaper, exec, kusogarch-cmd-wallpaper next

# Notifications
bindd = SUPER, comma, Dismiss Notification, exec, makoctl dismiss
bindd = SUPER SHIFT, comma, Dismiss All Notifications, exec, makoctl dismiss --all

# System info
bindd = SUPER, I, System Info, exec, kitty -e fastfetch
