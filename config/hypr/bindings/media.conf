# Kusogarch - Media & Hardware Keybindings

# Volume
bindeld = , XF86AudioRaiseVolume, Volume Up, exec, pamixer -i 5
bindeld = , XF86AudioLowerVolume, Volume Down, exec, pamixer -d 5
bindld = , XF86AudioMute, Mute Toggle, exec, pamixer -t
bindld = , XF86AudioMicMute, Mic Mute, exec, pamixer --default-source -t

# Brightness
bindeld = , XF86MonBrightnessUp, Brightness Up, exec, brightnessctl set +5%
bindeld = , XF86MonBrightnessDown, Brightness Down, exec, brightnessctl set 5%-

# Media playback
bindld = , XF86AudioPlay, Play/Pause, exec, playerctl play-pause
bindld = , XF86AudioPause, Pause, exec, playerctl pause
bindld = , XF86AudioNext, Next Track, exec, playerctl next
bindld = , XF86AudioPrev, Prev Track, exec, playerctl previous
bindld = , XF86AudioStop, Stop, exec, playerctl stop
