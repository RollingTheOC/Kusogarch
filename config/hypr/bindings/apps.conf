# Kusogarch - Application Keybindings

# Launcher
bindd = SUPER, Space, App Launcher, exec, walker
bindd = SUPER, Return, Terminal, exec, kitty
bindd = SUPER SHIFT, Return, Terminal (float), exec, kitty --class kitty-float

# Quick launch apps
bindd = SUPER, B, Browser, exec, chromium
bindd = SUPER, N, Editor (Neovim), exec, kitty -e nvim
bindd = SUPER, E, File Manager, exec, nautilus
bindd = SUPER, T, System Monitor, exec, kitty -e btop
bindd = SUPER, D, Docker (lazydocker), exec, kitty -e lazydocker
bindd = SUPER, G, Git (lazygit), exec, kitty -e lazygit

# Menus
bindd = SUPER ALT, Space, Control Menu, exec, kitty --class kusogarch-menu -e kusogarch-menu
bindd = SUPER, K, Keybindings, exec, kitty --class kusogarch-menu -e kusogarch-menu-keybindings
bindd = SUPER, Escape, Power Menu, exec, kitty --class kusogarch-menu -e kusogarch-cmd-powermenu

# Theme
bindd = SUPER CTRL SHIFT, Space, Theme Menu, exec, kitty --class kusogarch-menu -e kusogarch-theme-menu
