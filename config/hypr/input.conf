# Kusogarch - Input Configuration
# See: https://wiki.hyprland.org/Configuring/Variables/#input

input {
    kb_layout = us
    # kb_variant =
    # kb_options = caps:escape  # Uncomment to map Caps Lock to Escape

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        clickfinger_behavior = true
        scroll_factor = 1.0
    }
}
