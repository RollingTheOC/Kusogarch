# Kusogarch - Hyprland Main Configuration
# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use Kusogarch defaults (don't edit these directly!)
source = ~/.local/share/kusogarch/defaults/hypr/autostart.conf
source = ~/.local/share/kusogarch/defaults/hypr/bindings/media.conf
source = ~/.local/share/kusogarch/defaults/hypr/bindings/clipboard.conf
source = ~/.local/share/kusogarch/defaults/hypr/bindings/tiling.conf
source = ~/.local/share/kusogarch/defaults/hypr/bindings/utilities.conf
source = ~/.local/share/kusogarch/defaults/hypr/envs.conf
source = ~/.local/share/kusogarch/defaults/hypr/looknfeel.conf
source = ~/.local/share/kusogarch/defaults/hypr/input.conf
source = ~/.local/share/kusogarch/defaults/hypr/windows.conf
source = ~/.config/kusogarch/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# VM overrides (auto-populated if running in a VM, empty on bare metal)
source = ~/.config/hypr/envs-vm.conf

# Surface input overrides (placeholder on desktop, populated on Surface)
source = ~/.config/hypr/input-surface.conf
