# Kusogarch - Hyprland Main Configuration
# Three-layer system: defaults -> theme -> user configs
# Edit the individual config files below to customize.

# Source immutable defaults (baseline)
source = ~/.local/share/kusogarch/defaults/hypr/hyprland.conf

# Source active theme overrides
source = ~/.config/kusogarch/current/theme/hyprland.conf

# Source user config files
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/envs-vm.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/windows.conf
source = ~/.config/hypr/autostart.conf

# Source keybindings
source = ~/.config/hypr/bindings/apps.conf
source = ~/.config/hypr/bindings/tiling.conf
source = ~/.config/hypr/bindings/media.conf
source = ~/.config/hypr/bindings/utilities.conf
source = ~/.config/hypr/bindings/clipboard.conf

# Source Surface-specific input if present (no error if missing)
source = ~/.config/hypr/input-surface.conf
